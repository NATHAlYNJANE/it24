</head>
<body>
    <header class="navbar">
        <ul>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="applet4.html">Applet 4</a></li>

            <li><a href="todolist.html">todo list</a></li>
            <li><a href="weather.html">weather</a></li>
        </ul>
    </header>

    <h1 class="gallery-title">Gallery</h1>
    
    <div class="search-container">
        <input type="text" id="search-input" placeholder="Search..." oninput="filterGallery()">
    </div>

    <div class="gallery-container" id="gallery"></div>

    <script>
      
        const galleryData = [
            {
                title: "A Day in the Life of a College Student",
                description: "As an IT student, my day is filled with coding lectures, group projects, and debugging assignments.",
                image: "./image/1.jfif"
            },
            {
                title: "A Typical Day on Campus",
                description: "A typical day on campus starts with morning lectures, quick meals, and working on assignments.",
                image: "./image/2.jfif"
            },
            {
                title: "Park Adventures: Friends, Fresh Air, and Fun",
                description: "On a sunny afternoon, my friends and I set off for the park, sharing stories and enjoying frisbee.",
                image: "./image/3.jfif"
            },
            {
                title: "Embracing Freedom: A Journey to Inner Peace",
                description: "A spontaneous road trip led us to embrace freedom and create unforgettable memories.",
                image: "./image/4.jfif"
            },
            {
                title: "Family Bonds: Cherishing Time Together",
                description: "At a beautiful resort, my family and I enjoyed swimming and relaxing under the sun.",
                image: "./image/5.jfif"
            },
            {
                title: "College Life: One Day at a Time",
                description: "Each day in college brings new challenges, from late-night study sessions to spontaneous hangouts.",
                image: "./image/6.jfif"
            }
        ];

      
        function renderGallery() {
            const galleryContainer = document.getElementById('gallery');
            galleryContainer.innerHTML = ''; 

            galleryData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'container';
                card.setAttribute('onclick', `showDetails('Image ${index + 1}', '${item.title}')`);

                card.innerHTML = `
                    <img src="${item.image}" alt="Image ${index + 1}">
                    <h2>${item.title}</h2>
                    <p>${item.description}</p>
                `;
                galleryContainer.appendChild(card);
            });
        }

       
        function filterGallery() {
            const filter = document.getElementById('search-input').value.toLowerCase();
            const containers = document.querySelectorAll('.container');

            containers.forEach(container => {
                const title = container.querySelector('h2').textContent.toLowerCase();
                const description = container.querySelector('p').textContent.toLowerCase();

                if (title.includes(filter) || description.includes(filter)) {
                    container.style.display = '';
                } else {
                    container.style.display = 'none';
                }
            });
        }

      
        renderGallery();
    </script>
</body>
</html>
