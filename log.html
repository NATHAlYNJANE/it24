<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Log Applet</title>
    
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="map.html">Interactive Map</a></li>
            <li><a href="lab3.html">My Lab3</a></li>
            <li><a href="gallery.html">Gallery</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Log Applet</h1>
        <button onclick="addLog()">Add Log</button>
        <button class="reset-button" onclick="resetLogs()">Reset Logs</button>
        
        <div class="logs-container" id="logs-container">
          
        </div>
        
        <div class="total-logs" id="total-logs">
            Total Logs: 0
        </div>
    </div>
    <script>
        let logs = JSON.parse(localStorage.getItem('logs')) || [];

        function addLog() {
            const now = new Date();
            const logMessage = `Log entry at ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
            logs.push(logMessage);

            localStorage.setItem('logs', JSON.stringify(logs));

            displayLogs();
            updateLogCount();
        }
</body>
</html>
