<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InteractiveMap</title>
    <link rel="stylesheet" href="css/style.css">s
    <link rel="stylesheet" href="css/map.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
    <nav class="navbar">
        <ul>
            
            <li><a href="index.html">Home</a></li>
            <li><a href="lab3.html">My Lab3</a></li>
            <li><a href="gallery.html">Gallery</a></li>
        
            
        </ul>
    </nav>
    <div class="container">
        <h2>Interactive Map</h2>
        
        <div id="map"></div>
        
        <script>
           const locations = [
                { "name": "Manolo Fortich, Bukidnon", "lat": 8.3729, "lng": 124.8648 },
                { "name": "Camp Phillips, Bukidnon", "lat": 8.3506, "lng": 124.8641 },
                { "name": "Cagayan de Oro", "lat": 8.4542, "lng": 124.6319 },
                { "name": "Northern Bukidnon State College", "lat": 8.2981, "lng": 125.0812 }
            ];
        </script>
    </div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
       
        const map = L.map('map').setView([14.5995, 120.9842], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        locations.forEach(location => {
            L.marker([location.lat, location.lng])
                .addTo(map)
                .bindPopup(location.name)
                .openPopup();
        });
    </script>

    <script src="app.js"></script>
</body>
</html>
