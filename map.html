    <div class="container">
        
        <h1 class="map-title">Interactive Map</h1>
        <div id="map"></div>
        
        <script>
           const locations = [
                { "location1": "Manolo Fortich, Bukidnon", "lat": 8.3729, "lng": 124.8648 },
                { "location2": "Camp Phillips, Bukidnon", "lat": 8.3506, "lng": 124.8641 },
                { "location3": "Cagayan de Oro", "lat": 8.4542, "lng": 124.6319 },
                { "location4": "Northern Bukidnon State College", "lat": 8.2981, "lng": 125.0812 }
            ];
        </script>
    </div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
       
        const map = L.map('map').setView([14.5995, 120.9842], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        locations.forEach(location => {
            L.marker([location.lat, location.lng])
                .addTo(map)
                .bindPopup(location.name)
                .openPopup();
        });
         function navigateToLocation(index) {
                const location = locations[index];
                map.setView([location.lat, location.lng], 12);
                L.marker([location.lat, location.lng]).addTo(map).bindPopup(location.name).openPopup();
            }
              function searchLocation() {
                const input = document.getElementById("locationInput").value.toLowerCase();
                const location = locations.find(loc => loc.name.toLowerCase() === input);
                
                if (location) {
                    map.setView([location.lat, location.lng], 12);
                    L.marker([location.lat, location.lng]).addTo(map).bindPopup(location.name).openPopup();
                } else {
                    alert("Location not found. Please try again.");
                }
            }
    </script>

    <script src="app.js"></script>
</body>
