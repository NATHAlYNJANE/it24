<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>applet-4</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f9f9f9;
        }

        .applet-container {
            margin-top: 50px;
            padding: 20px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .search-bar {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .list-container {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list-item {
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .list-item.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="gallery.html">gallery</a></li>
            <li><a href="applet4.html">applet4</a></li>
            <li><a href="home.html">Home</a></li>
            <li><a href="lab3.html">My Lab3</a></li>
            <li><a href="map.html">InteractiveMap</a></li>
            <li><a href="logdetails.html">logdetails</a></li>
        </ul>
    </nav>
    <div class="applet-container">
        <h2>applet-4</h2>
        <input
            type="text"
            class="search-bar"
            id="searchBar"
            placeholder="Search items..."
        />
        <ul class="list-container" id="searchList">
            <li class="list-item">Apple</li>
            <li class="list-item">Banana</li>
            <li class="list-item">Cherry</li>
            <li class="list-item">Dragonfruit</li>
            <li class="list-item">Grapes</li>
            <li class="list-item">Mango</li>
            <li class="list-item">Orange</li>
            <li class="list-item">Papaya</li>
            <li class="list-item">Peach</li>
            <li class="list-item">Watermelon</li>
        </ul>
    </div>
    <script>
        const searchBar = document.getElementById("searchBar");
        const searchList = document.getElementById("searchList");

        searchBar.addEventListener("input", function () {
            const filter = searchBar.value.toLowerCase();
            const items = searchList.querySelectorAll(".list-item");

            items.forEach((item) => {
                const text = item.textContent.toLowerCase();
                if (text.includes(filter)) {
                    item.classList.remove("hidden");
                } else {
                    item.classList.add("hidden");
                }
            });
        });
    </script>
</body>
</html>
